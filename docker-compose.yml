services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cuentasclarastopicos-app:latest
    container_name: cuentasclarastopicos-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=cuentas_claras
      - DB_USERNAME=cuentas_claras
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:16-alpine
    container_name: cuentasclarastopicos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cuentas_claras
      POSTGRES_USER: cuentas_claras
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas_claras -d cuentas_claras"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
